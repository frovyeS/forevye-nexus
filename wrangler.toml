name = "forevye-nexus"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Statik arayüz public/ klasöründen sunulur; yalnızca /api/* istekleri Worker'dan geçer.
# Statik dosyaların güvenlik başlıkları public/_headers dosyasındadır.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "forevye-nexus"
database_id = "1d77f916-5264-4801-bcdb-075e50c928ed"
migrations_dir = "migrations"

# R2 (avatar depolama) şimdilik kapalı; etkinleştirince geri eklenir.

# Kristal fiyatını gerçek altından yenileyen zamanlanmış görev (5 dakikada bir).
[triggers]
crons = ["*/5 * * * *"]

# Gizli olmayan, yapılandırılabilir değerler. Para birimi: FN (kesin).
# Parasal değerler "minor unit" (1 FN = 100) cinsindendir.
[vars]
ENVIRONMENT = "production"
CURRENCY_CODE = "FN"
MAX_TRANSFER_MINOR = "500000"
DAILY_TRANSFER_LIMIT_MINOR = "1500000"
REAUTH_THRESHOLD_MINOR = "100000"
MAX_CARDS = "5"
SESSION_TTL_DAYS = "14"
OLD_NAME_RESERVE_DAYS = "30"
# Kristal borsası (kristal = oyunun "altın"ı; fiyatı gerçek altını izler, baz altın fiyatı = 1 FN)
MARKET_SPREAD_BPS = "50"          # alış/satış, orta fiyattan her yönde %0,50 sapar
MARKET_MAX_TRADE_MINOR = "1000000" # işlem başına en fazla 10.000 FN değerinde
MARKET_REFRESH_SEC = "60"
MARKET_STALE_SEC = "900"          # fiyat 15 dk güncellenmezse işlem durur
# GOLD_BASE_USD = "..."           # İsteğe bağlı: baz altın fiyatını (USD/ons) elle sabitler. Boşsa ilk çekilen fiyat baz olur.
# GOLD_API_URL = "https://api.gold-api.com/price/XAU"
# Hediye kartı = Mikro-Klima kristal kartları. Gizli anahtar (GIFTCARD_API_SECRET) wrangler secret ile verilir, Mikro-Klima'daki NEXUS_SECRET ile aynı olmalı.
# FOREVYE ID ile giriş: ID_URL = ID arayüzünün adresi, ID_API_URL = kimlik sunucusu (Mikro-Klima Worker). Mikro-Klima wrangler.toml → ID_REDIRECTS'e
# "sanal-banka=https://<bu-sitenin-adresi>/api/auth/id/callback" eklenmeli. LEGACY_LOGIN="off" olunca e-posta/şifre kayıt ve girişi kapanır (varsayılan: açık).
ID_URL = ""
ID_API_URL = "https://mikroklimakontrolmerkezi.forevye.workers.dev"
LEGACY_LOGIN = "on"
GIFTCARD_API_URL = "https://mikroklimakontrolmerkezi.forevye.workers.dev/api/ext/giftcard"
GIFTCARD_MINOR_PER_KRISTAL = "100"   # 1 kristal = 1,00 FN (minor unit 100). Kur kararını sen ver; değiştirmek için bu sayıyı güncelle.
# Brevo: BREVO_API_KEY secret olarak verilir. EMAIL_FROM adresi Brevo > Senders bölümünde doğrulanmış olmalı (ör. Gmail adresin).
EMAIL_PROVIDER = "brevo"
EMAIL_FROM = "FOREVYE NEXUS <SENIN-DOGRULANMIS-ADRESIN@gmail.com>"

# Test/staging ortamı: ayrı D1 ve R2 kullanılır, üretim verisiyle karıştırılmaz.
[env.staging]
name = "forevye-nexus-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
CURRENCY_CODE = "FN"
EMAIL_PROVIDER = "console"
DEV_EXPOSE_CODES = "true"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "forevye-nexus-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "migrations"
