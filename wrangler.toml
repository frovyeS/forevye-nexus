name = "forevye-nexus"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# --- İKİ CLOUDFLARE HESABI: YANLIŞ HESABA DEPLOY'U ENGELLE -------------------------------------------------
# Bu Worker (workers.dev alt alanı: forevyenexus), Mikro-Klima'dan (forevye) FARKLI bir Cloudflare hesabındadır.
# Aşağıdaki satırı kendi hesap kimliğinle aç: wrangler başka hesapta oturum açıkken bu Worker'ı yanlış yere deploy etmez.
#   Hesap kimliği: Cloudflare paneli > Workers & Pages > sağ kenardaki "Account ID"   ya da   npx wrangler whoami
# account_id = "BURAYA_NEXUS_CLOUDFLARE_HESAP_KIMLIGI"
#
# CORS / SİTE ADRESLERİ: İKİ GITHUB HESABI (mhaforevye + frovyes) KODA GÖMÜLÜDÜR (src/lib/origins.js).
# Aşağıdaki BANK_URL / EDITOR_URL / SHOP_URL / PASS_URL ve *_ORIGINS değerleri yalnızca bağlantı adreslerini üretir ve
# bu iki adrese EK origin ekler; panelde silinseler ya da yanlış olsalar bile iki GitHub hesabı HER ZAMAN izinli kalır.

# ÖNEMLİ: Her deploy'da Cloudflare panelinden elle eklenen değişkenler (mail, ID adresi vb.) silinmesin.
# Dosyada olmayan panel değişkenleri korunur. Sırlar (secret) zaten deploy'dan etkilenmez.
keep_vars = true

# Mikro-Klima Worker'ı (hediye kartı + ortak posta) BAŞKA bir Cloudflare hesabında olduğu için servis bağlantısı
# ([[services]]) kullanılmaz; Nexus ona aşağıdaki [vars] adresleri üzerinden normal HTTP isteği atar.

# Statik arayüz public/ klasöründen sunulur; yalnızca /api/* istekleri Worker'dan geçer.
# Statik dosyaların güvenlik başlıkları public/_headers dosyasındadır.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "forevye-nexus"
database_id = "1d77f916-5264-4801-bcdb-075e50c928ed"
migrations_dir = "migrations"

# R2 (avatar depolama) şimdilik kapalı; etkinleştirince geri eklenir.

# Kristal fiyatını gerçek altından yenileyen zamanlanmış görev (5 dakikada bir).
[triggers]
crons = ["*/5 * * * *"]

# Gizli olmayan, yapılandırılabilir değerler. Para birimi: FN (kesin).
# Parasal değerler "minor unit" (1 FN = 100) cinsindendir.
[vars]
ENVIRONMENT = "production"
CURRENCY_CODE = "FN"
EDITOR_URL = "https://mhaforevye.github.io/forevye_nexus_bank/"
BANK_URL = "https://mhaforevye.github.io/forevye_nexus_bank/"
SHOP_URL = "https://mhaforevye.github.io/nexus-market/"
MAX_TRANSFER_MINOR = "500000"
DAILY_TRANSFER_LIMIT_MINOR = "1500000"
REAUTH_THRESHOLD_MINOR = "100000"
MAX_CARDS = "5"
SESSION_TTL_DAYS = "14"
OLD_NAME_RESERVE_DAYS = "30"
# Kristal borsası (kristal = oyunun "altın"ı; fiyatı gerçek altını izler, baz altın fiyatı = 1 FN)
MARKET_SPREAD_BPS = "50"          # alış/satış, orta fiyattan her yönde %0,50 sapar
MARKET_MAX_TRADE_MINOR = "8900000" # işlem başına en fazla 89.000 FN değerinde
MARKET_REFRESH_SEC = "60"
MARKET_INITIAL_PRICE_MICRO = "32000000" # Yeni kurulum başlangıç referansı: 32 FN; mevcut fiyatı sıfırlamaz.
MARKET_STALE_SEC = "900"          # fiyat 15 dk güncellenmezse işlem durur
MARKET_FALLBACK_ENABLED = "true"  # dış kaynak yokken sanal fiyat hareketi
MARKET_FALLBACK_VOLATILITY_BPS = "85" # 5 dakikalık adımda azami ±%0,85
# GOLD_BASE_USD = "..."           # İsteğe bağlı: baz altın fiyatını (USD/ons) elle sabitler. Boşsa ilk çekilen fiyat baz olur.
# GOLD_API_URL = "https://api.gold-api.com/price/XAU"
# Hediye kartı (kristal kartı) Mikro-Klima Worker'ında; Nexus ona imzalı istek atar.
# Gizli değer: npx wrangler secret put GIFTCARD_API_SECRET   (Mikro-Klima'daki NEXUS_SECRET ile AYNI olmalı)
# ADRES BURADAN OKUNUR: dosyadaki değer her deploy'da panelde elle yazılan değeri ezer. Adres değişirse BURAYI düzenle.
# Doğru adres, Mikro-Klima Worker'ının herkese açık adresidir; tarayıcıda <adres>/api/ext/giftcard/health açınca {"ok":true} görünmelidir.
# Mikro-Klima ayrı hesapta olduğundan adres Nexus'unkinden (forevyenexus.workers.dev) FARKLI bir workers.dev alt alan adı olabilir.
GIFTCARD_API_URL = "https://mikroklimakontrolmerkezi.forevye.workers.dev"
# E-posta: Mikro-Klima'daki ortak posta servisi (Brevo); adresi Mikro-Klima Worker'ının herkese açık URL'sidir. Gönderen adresi orada ayarlıdır; EMAIL_FROM gerekmez.
EMAIL_PROVIDER = "relay"
MAIL_RELAY_URL = "https://mikroklimakontrolmerkezi.forevye.workers.dev"
ID_URL = "https://mhaforevye.github.io/forevye-id"
ID_API_URL = "https://mikroklimakontrolmerkezi.forevye.workers.dev"
# Panelde elle girilen ve kaybolmasın istenen değerler (dosya her deploy'da panel değerini ezer, bu yüzden burada sabit):
PASS_URL = "https://mhaforevye.github.io/nexus-pass/"
EDITOR_ORIGINS = "https://mhaforevye.github.io"
GIFTCARD_MINOR_PER_KRISTAL = "100"
# NOT: ID_REDIRECTS Nexus'ta KULLANILMAZ; "FOREVYE ID ile giriş" adresleri Mikro-Klima Worker'ında (wrangler.toml + worker/identity.js) tutulur.
# Aşağıdakileri panelde elle girdiysen bırak (keep_vars korur); dosyada tutmak istersen açıp kendi adreslerini yaz:
# EDITOR_URL = "https://..."    # Kart editörü
# PASS_URL = "https://..."      # Nexus Pass
# SHOP_URL = "https://..."      # Nexus Market

# Test/staging ortamı: ayrı D1 ve R2 kullanılır, üretim verisiyle karıştırılmaz.
[env.staging]
name = "forevye-nexus-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
CURRENCY_CODE = "FN"
EMAIL_PROVIDER = "console"
DEV_EXPOSE_CODES = "true"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "forevye-nexus-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "migrations"
